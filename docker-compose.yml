services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Live-mount project root so all file edits on host immediately update inside container
      - .:/app
      # Keep container node_modules isolated
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    command: nodemon -L server.js
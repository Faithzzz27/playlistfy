<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Song - Playlistfy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=11" />
    <script src="lucide.min.js"></script>
  </head>
  <body class="login-page">
    <main class="login-wrap">
      <div class="login-card">
        <div class="brand login-brand">
          <span class="logo"><i data-lucide="waves"></i></span>
          <span>Playlistfy</span>
        </div>

        <h2>Edit Song</h2>
        <p class="muted">Update the song details in your playlist.</p>

        <form id="editForm">
          <div class="form-row">
            <label for="song">Song Title</label>
            <input type="text" id="song" name="song" placeholder="Enter song title" required />
          </div>

          <div class="form-row">
            <label for="artist">Artist</label>
            <input type="text" id="artist" name="artist" placeholder="Enter artist name" required />
          </div>

          <div class="form-row">
            <label for="genre">Genre</label>
            <input type="text" id="genre" name="genre" placeholder="Enter genre" required />
          </div>

          <p id="editError" class="form-error hidden" role="alert"></p>

          <div class="button-row" style="margin-top: 18px;">
            <button type="submit" class="primary-btn" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
              <i data-lucide="check"></i> Save Changes
            </button>
            <a href="/index.html" class="secondary-btn" style="text-decoration: none; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
              <i data-lucide="x"></i> Cancel
            </a>
          </div>
        </form>
      </div>
    </main>

    <script src="common.js?v=10"></script>
    <script src="edit.js?v=10"></script>
    <script>
      if (window.lucide) { lucide.createIcons(); }
    </script>
  </body>
</html>

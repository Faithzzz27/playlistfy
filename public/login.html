<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlistify Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="spotify-theme login-page">
    <div class="login-wrap">
      <div class="login-card panel">
        <div class="brand login-brand">
          <span class="logo">♫</span>
          <span>Playlistify</span>
        </div>

        <h2>Welcome back</h2>
        <p class="login-subtext">Log in to build your own soundtrack.</p>

        <form id="loginForm">
          <div class="form-row">
            <label for="loginUsername">Username</label>
            <input type="text" id="loginUsername" placeholder="Enter your username" required />
          </div>

          <div class="form-row">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required />
          </div>

          <div class="button-row auth-buttons">
            <button type="submit" class="primary-btn wide-btn">Login</button>
            <button type="button" id="registerBtn" class="secondary-btn wide-btn">Create Account</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
